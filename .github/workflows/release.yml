name: Release
# Push a tag named v<versionName> (for example v0.3.0) to build, sign and publish the APK as a GitHub release.
# The APK's in-app updater reads this repository's latest release, so a fork that adds its own signing secrets
# publishes updates for its own users. Requires repository secrets FORGE_KEYSTORE_BASE64, FORGE_KEYSTORE_PASSWORD,
# FORGE_KEY_ALIAS and FORGE_KEY_PASSWORD; optional variable FORGE_CERT_SHA256 pins the expected signing certificate.
# Release APKs are built without google-services.json: FCM away alerts need a source build with the operator's
# own Firebase project (relay/README.md).
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
  attestations: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools  # the default also asks for the retired 'tools' package
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.FORGE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FORGE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FORGE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FORGE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Add the FORGE_KEYSTORE_BASE64, FORGE_KEYSTORE_PASSWORD, FORGE_KEY_ALIAS and FORGE_KEY_PASSWORD secrets"
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > "$RUNNER_TEMP/signing.properties"
          echo "FORGE_SIGNING_PROPERTIES=$RUNNER_TEMP/signing.properties" >> "$GITHUB_ENV"
      - name: Build
        env:
          FORGE_UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download/
        run: |
          test ! -e app/google-services.json
          ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - name: Verify version and signature
        env:
          EXPECTED_CERT: ${{ vars.FORGE_CERT_SHA256 }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          VERSION=$("$TOOLS/aapt2" dump badging "$APK" | head -n 1 | sed -E "s/.*versionName='([^']+)'.*/\1/")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION"
            exit 1
          fi
          CERT=$("$TOOLS/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          if [ -n "$EXPECTED_CERT" ] && [ "$(echo "$CERT" | tr -d ': ' | tr A-F a-f)" != "$(echo "$EXPECTED_CERT" | tr -d ': ' | tr A-F a-f)" ]; then
            echo "::error::APK is signed by $CERT, not the pinned FORGE_CERT_SHA256"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CERT=$CERT" >> "$GITHUB_ENV"
      - name: Package
        run: |
          NOTES="$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")" scripts/publish-apk.sh dist
          rm dist/forge-latest.apk
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/forge-*.apk
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls dist/forge-*.apk)
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          {
            echo "Forge $VERSION for Kandev v0.98.0. Install \`$(basename "$APK")\` on Android 8.0+."
            echo
            echo "- APK SHA-256: \`$SHA\`"
            echo "- Signing certificate SHA-256: \`$CERT\`"
            echo "- FCM away alerts: not configured in this build (see relay/README.md for a source build)"
            echo "- In-app updates: Settings › About › App updates reads this repository's latest release"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "$APK" dist/ca.mslab.forge.json \
            --title "Forge $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
      - if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/signing.properties"
